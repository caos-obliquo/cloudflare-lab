# pr.yml — PR orchestrator
# REQUIRED checks (branch-protection exact-name match): lint, security, build, tf-lint, integration
# EXTRA (informational, not required): rust-deep, security-deep, tf-modules
name: PR Check

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # ─── REQUIRED CHECKS (exact job IDs for branch protection) ──────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit
      - run: cargo audit
      - run: npm audit --omit=dev || true
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --target wasm32-unknown-unknown
      # HARDENED: tests exist and MUST pass — no fallback
      - run: cargo test --workspace

  tf-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false
      - run: terraform validate

  # ─── INTEGRATION (required) ──────────────────────────────
  # Runs integration tests: boots wrangler dev, runs gateway/auth/analytics suites.
  # Must pass before merge.
  rust-deep:
    uses: ./.github/workflows/ci-rust.yml

  security-deep:
    uses: ./.github/workflows/ci-security.yml

  tf-modules:
    uses: ./.github/workflows/ci-terraform.yml

  integration:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: test-secret-for-ci
      SKIP_NO_BINDINGS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: cargo install worker-build
      - uses: Swatinem/rust-cache@v2
      # NOTE: tests/integration/run-all.sh boots wrangler dev via npx.
      # If wrangler local-mode flakiness appears, pin wrangler version
      # by installing a specific version (e.g., npm install -g wrangler@4.111.0)
      # before running the test script.
      - run: bash tests/integration/run-all.sh --only gateway,auth,analytics
