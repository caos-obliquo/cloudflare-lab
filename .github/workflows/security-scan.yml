# security-scan.yml — Scheduled + manual security scans
# Calls ci-security.yml for scanning; retains cargo audit --json artifact
name: Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC
  workflow_dispatch:

jobs:
  # Main security scanning via reusable template
  scan:
    uses: ./.github/workflows/ci-security.yml
    with:
      upload_artifacts: false

  # Separate artifact job for cargo audit JSON report.
  # Uses cargo install (rustsec/audit-check in ci-security.yml doesn't
  # produce a JSON artifact). Kept here for historical reporting.
  audit-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit
      - run: cargo audit --json > audit-report.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
