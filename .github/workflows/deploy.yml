name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit
      - run: cargo audit
      - run: npm audit --omit=dev || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --target wasm32-unknown-unknown
      - run: cargo check -p devops-api

  resolve-env:
    needs: [lint, security, build]
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.resolve.outputs.env }}
    steps:
      - id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "env=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "env=staging" >> "$GITHUB_OUTPUT"
          fi

  deploy-auth:
    needs: resolve-env
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: npm install -g wrangler
      - run: cargo install worker-build
      - uses: Swatinem/rust-cache@v2
      - working-directory: workers/auth
        run: worker-build --release
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/auth
          command: deploy --env ${{ needs.resolve-env.outputs.env }}
          secrets: |
            SESSION_SECRET

  deploy-gateway:
    needs: [resolve-env, deploy-auth]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: npm install -g wrangler
      - run: cargo install worker-build
      - uses: Swatinem/rust-cache@v2
      - working-directory: workers/gateway
        run: worker-build --release
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/gateway
          command: deploy --env ${{ needs.resolve-env.outputs.env }}

  deploy-analytics:
    needs: [resolve-env, deploy-auth]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: npm install -g wrangler
      - run: cargo install worker-build
      - uses: Swatinem/rust-cache@v2
      - working-directory: workers/analytics
        run: worker-build --release
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/analytics
          command: deploy --env ${{ needs.resolve-env.outputs.env }}
          secrets: |
            SESSION_SECRET

  smoke:
    needs: [resolve-env, deploy-gateway, deploy-analytics]
    runs-on: ubuntu-latest
    steps:
      - id: urls
        run: |
          E=${{ needs.resolve-env.outputs.env }}
          echo "auth=https://auth-worker-${E}.workers.dev/health" >> "$GITHUB_OUTPUT"
          echo "gateway=https://gateway-worker-${E}.workers.dev/health" >> "$GITHUB_OUTPUT"
          echo "analytics=https://analytics-worker-${E}.workers.dev/health" >> "$GITHUB_OUTPUT"
      - run: |
          for url in "${{ steps.urls.outputs.auth }}" "${{ steps.urls.outputs.gateway }}" "${{ steps.urls.outputs.analytics }}"; do
            for i in {1..6}; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" || echo "000")
              if [[ "$code" =~ ^(2|3)..$ ]]; then
                echo "OK $url -> $code"
                break
              fi
              if [[ "$i" -eq 6 ]]; then
                echo "FAIL $url -> $code"
                exit 1
              fi
              sleep 10
            done
          done
