# deploy.yml — Deploy pipeline
# lint/security call reusable templates; build kept inline (wasm release build
# in ci-rust.yml would be redundant with worker-build --release in deploy jobs).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  lint:
    uses: ./.github/workflows/ci-rust.yml

  security:
    uses: ./.github/workflows/ci-security.yml

  # build kept inline — ci-rust.yml's wasm-build runs cargo build --release
  # which is redundant with worker-build --release in each deploy job below.
  # cargo check here provides quick compilation gate without the release delay.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --target wasm32-unknown-unknown

  deploy-auth:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: npm install -g wrangler
      - run: cargo install worker-build
      - uses: Swatinem/rust-cache@v2
      - working-directory: workers/auth
        run: worker-build --release
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/auth
          command: deploy

  deploy-gateway:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: npm install -g wrangler
      - run: cargo install worker-build
      - uses: Swatinem/rust-cache@v2
      - working-directory: workers/gateway
        run: worker-build --release
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/gateway
          command: deploy

  deploy-analytics:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: npm install -g wrangler
      - run: cargo install worker-build
      - uses: Swatinem/rust-cache@v2
      - working-directory: workers/analytics
        run: worker-build --release
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/analytics
          command: deploy

  smoke:
    needs: [deploy-auth, deploy-gateway, deploy-analytics]
    runs-on: ubuntu-latest
    steps:
      - run: |
          for url in "https://auth-worker.workers.dev/health" "https://gateway-worker.workers.dev/health" "https://analytics-worker.workers.dev/health"; do
            for i in {1..6}; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" || echo "000")
              if [[ "$code" =~ ^(2|3)..$ ]]; then
                echo "OK $url -> $code"
                break
              fi
              if [[ "$i" -eq 6 ]]; then
                echo "FAIL $url -> $code"
                exit 1
              fi
              sleep 10
            done
          done
