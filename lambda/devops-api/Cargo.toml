[package]
name = "devops-api"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
lambda_http = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
base64 = "0.22"
