[package]
name = "auth-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8.5", features = ["d1", "queue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cloudflare-shared = { path = "../../shared" }
sha2 = "0.10"
hex = "0.4"
getrandom = { version = "0.2", features = ["js"] }

