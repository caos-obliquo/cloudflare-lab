name = "auth-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2026-07-16"
account_id = "b6d892f66c18ab372241fe474f507d90"

[build]
command = "worker-build --release"

[[kv_namespaces]]
binding = "SESSIONS"
# FIXME: Set id after `terraform apply` creates the sessions_kv namespace
id = ""
preview_id = "5d5150177bb54338a19ddb35e010cbe4"

[[d1_databases]]
binding = "D1"
database_name = "test-d1-database"
database_id = "1b7da405-4460-4f87-8e75-24e3934d0386"

# SESSION_SECRET: HMAC signing key for stateless session tokens.
# Set via: `wrangler secret put SESSION_SECRET`
# WARNING: Changing this invalidates ALL existing sessions.

# DO binding for rate limiter. References rate-limiter worker's RateLimiter class.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"
script_name = "rate-limiter"

[[migrations]]
tag = "v1"
new_classes = ["RateLimiter"]

