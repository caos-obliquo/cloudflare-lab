name = "gateway-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2026-07-16"
account_id = "b6d892f66c18ab372241fe474f507d90"

[build]
command = "worker-build --release"

[[kv_namespaces]]
binding = "TEST_KV"
id = "bf6725a35c9745858b9468f878dc69f0"

[[d1_databases]]
binding = "D1"
database_name = "test-d1-database"

[[queues.producers]]
binding = "QUEUE"
queue = "test-queue"

[[queues.consumers]]
queue = "test-queue"
max_batch_size = 10
max_batch_timeout = 5

[ai]
binding = "AI"

[[services]]
binding = "AUTH"
service = "auth-worker"

# SIGNOZ_OTEL_ENDPOINT: set as secret for production OTLP export.
# Local dev reads from [vars] above (localhost).
# When unset, worker gracefully skips span export.

