[package]
name = "cloudflare-shared"
version = "0.1.0"
edition = "2021"

[dependencies]
worker = { version = "0.8.5", features = ["d1", "queue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ring = "0.17"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }

