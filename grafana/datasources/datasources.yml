# Grafana datasource auto-provisioning.
# Datasources are made available in the datasource picker.
apiVersion: 1

datasources:
  - name: "Prometheus"
    type: "prometheus"
    access: "proxy"
    url: "http://prometheus:9090"
    isDefault: true
    editable: true
    uid: "prometheus"
    jsonData:
      httpMethod: "POST"

  - name: "Loki"
    type: "loki"
    access: "proxy"
    url: "http://loki:3100"
    isDefault: false
    editable: true
    uid: "loki"
    jsonData:
      maxLines: 1000
